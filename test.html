<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TV Player</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #000;
      color: white;
      display: flex;
      height: 100vh;
    }

    #sidebar {
      width: 30%;
      background: #111;
      overflow-y: auto;
      padding: 10px;
    }

    #player {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .channel {
      padding: 10px;
      margin: 5px 0;
      background: #222;
      cursor: pointer;
      border-radius: 8px;
    }

    .channel:hover {
      background: #333;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    input {
      width: 95%;
      padding: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div id="sidebar">
  <input id="search" placeholder="Rechercher..." oninput="loadChannels()" />
  <div id="list"></div>
</div>

<div id="player">
  <h2>Choisis une chaîne 📺</h2>
</div>

<script>
const API = "https://livewatch.top/api/embed?type=tv&country=all";

let channels = [];

async function loadChannels() {
  try {
    const search = document.getElementById("search").value.toLowerCase();

    const res = await fetch(API);
    const data = await res.json();

    channels = data;

    const list = document.getElementById("list");
    list.innerHTML = "";

    data
      .filter(c => !search || c.name.toLowerCase().includes(search))
      .forEach(channel => {
        const div = document.createElement("div");
        div.className = "channel";
        div.innerText = channel.name;

        div.onclick = () => playChannel(channel);

        list.appendChild(div);
      });

  } catch (e) {
    console.error("Erreur API", e);
  }
}

function playChannel(channel) {
  const player = document.getElementById("player");

  // priorité embed principal ou fallback
  const url = channel.embed || channel.id;

  player.innerHTML = `
    <iframe
      src="https://livewatch.top/player?url=${encodeURIComponent(url)}"
      allow="autoplay; fullscreen; encrypted-media"
      allowfullscreen>
    </iframe>
  `;
}

// init
loadChannels();
</script>

</body>
</html>
